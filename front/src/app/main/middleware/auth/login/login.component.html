<p-toast></p-toast>

<div class="auth-shell">
    <section class="auth-panel">
        <div class="auth-brand">
            <span class="amigopet-logo-mark">AP</span>
            <div>
                <h1>AmigoPet</h1>
                <p>Gestão completa para petshops modernos</p>
            </div>
        </div>

        <form [formGroup]="form" (ngSubmit)="login()" class="auth-form">
            <div>
                <h2>Entrar</h2>
                <span>Acesse sua operação em poucos segundos.</span>
            </div>

            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" pInputText formControlName="email" placeholder="voce@amigopet.com" />
            </div>

            <div class="field">
                <label for="senha">Senha</label>
                <p-password inputId="senha" formControlName="senha" [toggleMask]="true" [feedback]="false" styleClass="w-full" inputStyleClass="w-full"></p-password>
            </div>

            <button pButton pRipple type="submit" label="Entrar" icon="pi pi-sign-in" class="w-full" [loading]="loading"></button>

            <a routerLink="/auth/register">Criar novo usuário</a>
        </form>
    </section>
</div>
