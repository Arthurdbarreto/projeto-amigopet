<p-toast></p-toast>

<div class="auth-shell">
    <section class="auth-panel">
        <div class="auth-brand">
            <span class="amigopet-logo-mark">AP</span>
            <div>
                <h1>AmigoPet</h1>
                <p>Configure o acesso da sua equipe</p>
            </div>
        </div>

        <form [formGroup]="form" (ngSubmit)="register()" class="auth-form">
            <div>
                <h2>Novo usuário</h2>
                <span>Crie uma conta para acessar o sistema.</span>
            </div>

            <div class="field">
                <label for="nome">Nome</label>
                <input id="nome" pInputText formControlName="nome" placeholder="Nome completo" />
            </div>

            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" pInputText formControlName="email" placeholder="voce@amigopet.com" />
            </div>

            <div class="field">
                <label for="perfil">Perfil</label>
                <p-dropdown inputId="perfil" [options]="perfis" formControlName="perfil" styleClass="w-full"></p-dropdown>
            </div>

            <div class="field">
                <label for="senha">Senha</label>
                <p-password inputId="senha" formControlName="senha" [toggleMask]="true" styleClass="w-full" inputStyleClass="w-full"></p-password>
            </div>

            <button pButton pRipple type="submit" label="Cadastrar" icon="pi pi-user-plus" class="w-full" [loading]="loading"></button>

            <a routerLink="/auth/login">Já tenho acesso</a>
        </form>
    </section>
</div>
